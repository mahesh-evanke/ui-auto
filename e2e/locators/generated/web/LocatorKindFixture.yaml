# ---- Recorder-captured (Playwright semantic) kinds, same file, same run ----
# Simplified format: plain strings only, no embedded JSON. ARIA role folds
# into the kind itself (role:button) so "role" never appears twice.
Save By Role:
  - role:button
  - Save
  - //button[@data-testid='save-btn']
Password By Label:
  - label
  - Password
  - //input[@id='pwd']
Search By Placeholder:
  - placeholder
  - Search here
  - //input[@placeholder='Search here']
Logo By AltText:
  - alttext
  - Company Logo
  - //img[@alt='Company Logo']
Info By Title:
  - title
  - More information
  - //span[@title='More information']
Paragraph By Text:
  - text
  - Standalone paragraph text
  - //p[normalize-space(.)='Standalone paragraph text']
Save By TestId:
  - testid
  - save-btn
  - //button[@data-testid='save-btn']
