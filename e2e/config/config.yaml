# ════════════════════════════════════════════════════════════════════════════
#  Central configuration for the Playwright + Cucumber framework.
#  Loaded at startup by utils/config.ts (maps these values into process.env).
# ════════════════════════════════════════════════════════════════════════════

# ── Browser ───────────────────────────────────────────────────────────────────
browser:
  # chromium | chrome | edge | firefox  (maps to Playwright channel)
  name: chrome
  headless: false
  slowMo: 1000            # ms delay between actions (visible runs); 0 for fast
  clickTimeoutMs: 30000
  # Mobile/device emulation. "" or null = desktop full window.
  # Supported: iPhone SE, iPhone XR, iPhone 12 Pro, iPhone 14 Pro Max, Pixel 7,
  #   Samsung Galaxy S8+, Samsung Galaxy S20 Ultra, iPad Mini, iPad Air, iPad Pro,
  #   Surface Pro 7, Surface Duo, Galaxy Z Fold 5, Asus Zenbook Fold,
  #   Samsung Galaxy A51/71, Nest Hub, Nest Hub Max.
  viewportDevice: " "
  # Record a video of each recording session AND each test run (saved under reports/recorded).
  recordVideo: true

# ── Test run ──────────────────────────────────────────────────────────────────
run:
  # local | grid  (grid not yet wired — local is the default execution path)
  executionMode: local
  # environment: val | dev | standalone
  environment: val
  # cucumber tag expression to filter scenarios, e.g. "@smoke and not @wip"
  tags: ""
  retryOnFail: 0
  reportFolder: ./reports/integrationTests
  maxInstances: 1          # parallel cucumber workers (1 = sequential)
  # feature discovery (run.js passes explicit paths; this is the fallback glob)
  features: ./feature/generated/**/*.feature
  getPageTimeoutMs: 400000
  # How long to wait for a redirect / next page to finish loading before checking text.
  redirectWaitMs: 150000
  # How long to keep re-checking the page for the expected text (covers slow redirects).
  verifyTimeoutMs: 200000

# ── Environment URLs (optional convenience) ───────────────────────────────────
urls:
  standalone: http://localhost:4042/
  val: https://customer-billing-deve.vercel.app/
  dev: https://customer-billing-deve.vercel.app/


