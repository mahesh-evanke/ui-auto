# ─────────────────────────────────────────────────────────────────────────────
# Common locators shared across ALL pages.
# These are resolved first before any page-specific locator file.
#
# Format:
#   ElementName: [strategy, selector]
#   strategy: xpath | css | role | text
#
# Examples:
#   Header Logo:       [css, header img.logo]
#   Navigation Menu:   [css, nav[role="navigation"]]
#   Logout:            [xpath, //button[normalize-space()='Logout'] | //a[normalize-space()='Logout']]
# ─────────────────────────────────────────────────────────────────────────────

# ── Navigation ────────────────────────────────────────────────────────────────
# Header Logo:       [css, header img]
# Navbar:            [css, nav]
# Sidebar:           [css, aside, [role="complementary"]]

# ── Auth ──────────────────────────────────────────────────────────────────────
# Login Button:      [xpath, //button[normalize-space()='Login'] | //a[normalize-space()='Login']]
# Logout Button:     [xpath, //button[normalize-space()='Logout'] | //a[normalize-space()='Logout']]

# ── Common Actions ────────────────────────────────────────────────────────────
# Save Button:       [xpath, //button[normalize-space()='Save']]
# Cancel Button:     [xpath, //button[normalize-space()='Cancel']]
# Submit Button:     [xpath, //button[@type='submit']]
# Close Button:      [xpath, //button[normalize-space()='Close'] | //*[@aria-label='Close']]
# Delete Button:     [xpath, //button[normalize-space()='Delete']]
# Edit Button:       [xpath, //button[normalize-space()='Edit']]

# ── Feedback ──────────────────────────────────────────────────────────────────
# Success Message:   [css, [role="alert"].success, .toast-success, .alert-success]
# Error Message:     [css, [role="alert"].error, .toast-error, .alert-danger]
# Loading Spinner:   [css, [role="progressbar"], .spinner, .loading]

# ── Modal / Dialog ────────────────────────────────────────────────────────────
# Modal:             [css, [role="dialog"]]
# Modal Title:       [css, [role="dialog"] h1, [role="dialog"] h2]
# Modal Confirm:     [xpath, //*[@role='dialog']//button[normalize-space()='Confirm' or normalize-space()='Yes' or normalize-space()='OK']]
# Modal Cancel:      [xpath, //*[@role='dialog']//button[normalize-space()='Cancel' or normalize-space()='No']]

# ── Footer ────────────────────────────────────────────────────────────────────
# Footer:            [css, footer]
