# ════════════════════════════════════════════════════════════════════════════
#  Template config. Copy to config.yaml and adjust.
#      cp config.example.yaml config.yaml
# ════════════════════════════════════════════════════════════════════════════

# ── Browser ───────────────────────────────────────────────────────────────────
browser:
  name: chromium                # chromium | chrome | edge | firefox
  headless: false
  slowMo: 1000
  clickTimeoutMs: 30000

# ── Test run ──────────────────────────────────────────────────────────────────
run:
  tags: ""                      # cucumber tag expression, e.g. "@smoke"
  retryOnFail: 0
  reportFolder: ./reports/integrationTests
  features: ./feature/generated/**/*.feature
  getPageTimeoutMs: 40000
  redirectWaitMs: 15000
  verifyTimeoutMs: 20000
